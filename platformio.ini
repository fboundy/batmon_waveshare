; BatMon display firmware for Waveshare ESP32-S3-Touch-LCD-2.1
;
; Uses the pioarduino fork of the espressif32 platform so that we get
; Arduino-ESP32 core 3.x (ESP-IDF 5.x).  The Waveshare RGB panel code
; relies on IDF 5 esp_lcd APIs (esp_lcd_rgb_panel_get_frame_buffer,
; bounce buffers) and the core-3 ledcAttach() API.

[platformio]
default_envs = waveshare_s3_lcd_2_1

[env:waveshare_s3_lcd_2_1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 8 MB octal PSRAM, 16 MB QIO flash
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    lvgl/lvgl@8.3.11
    h2zero/NimBLE-Arduino@^2.2.3

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -I include
    ; NimBLE: one central role, no peripheral/advertising code
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Host-side unit tests for the protocol codec (no hardware needed):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src
test_build_src = yes
build_src_filter = +<batmon/batmon_protocol.cpp>

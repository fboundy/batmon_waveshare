; BatMon display firmware for Waveshare ESP32-S3 boards
;
;   pio run -e waveshare_s3_lcd_2_1     2.1" round touch (ST7701 RGB panel)
;   pio run -e waveshare_s3_lcd_1_9     1.9" landscape, no touch (ST7789 SPI)
;
; Uses the pioarduino fork of the espressif32 platform so that we get
; Arduino-ESP32 core 3.x (ESP-IDF 5.x): the Waveshare RGB panel code relies
; on IDF 5 esp_lcd APIs and the core-3 ledcAttach() API.

[platformio]
default_envs = waveshare_s3_lcd_2_1

; ---------------------------------------------------------------------------
; Common to every ESP32-S3R8 board (8 MB octal PSRAM, 16 MB QIO flash)
; ---------------------------------------------------------------------------
[esp32s3_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    lvgl/lvgl@8.3.11
    h2zero/NimBLE-Arduino@^2.2.3
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -I include
    ; NimBLE: central (BatMon) + peripheral (phone pairing), bonds for phones
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -D CONFIG_BT_NIMBLE_MAX_BONDS=8

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-2.1  (round 480x480, touch)
; ---------------------------------------------------------------------------
[env:waveshare_s3_lcd_2_1]
extends = esp32s3_common
build_flags =
    ${esp32s3_common.build_flags}
    -D BOARD_WS_LCD_2_1
build_src_filter =
    +<*>
    -<board/board_ws_1_9.cpp>
    -<board/display_st7789.cpp>
    -<ui/ui_layout_wide.cpp>

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-LCD-1.9  (landscape 320x170, no touch)
; The ST7789 wants big-endian RGB565 over SPI, so LVGL renders byte-swapped.
; ---------------------------------------------------------------------------
[env:waveshare_s3_lcd_1_9]
extends = esp32s3_common
build_flags =
    ${esp32s3_common.build_flags}
    -D BOARD_WS_LCD_1_9
    -D LV_COLOR_16_SWAP=1
build_src_filter =
    +<*>
    -<board/board_ws_2_1.cpp>
    -<board/display_st7701.cpp>
    -<board/touch_cst820.cpp>
    -<board/tca9554.cpp>
    -<board/rtc.cpp>
    -<ui/ui_layout_round.cpp>
    -<ui/font_montserrat_72_digits.c>

; ---------------------------------------------------------------------------
; Host-side unit tests for the protocol codec (no hardware needed):
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src
test_build_src = yes
build_src_filter = +<batmon/batmon_protocol.cpp>

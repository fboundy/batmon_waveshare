name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.espressif
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      # click 8.2 breaks the esptool 5.0 bundled with pioarduino (get_metavar ctx)
      - run: pip install platformio "click<8.2"
      - name: Host unit tests (protocol codec)
        run: pio test -e native
      - name: Build firmware (both boards)
        run: pio run -e waveshare_s3_lcd_2_1 -e waveshare_s3_lcd_1_9
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/waveshare_s3_lcd_2_1/firmware.bin
            .pio/build/waveshare_s3_lcd_2_1/bootloader.bin
            .pio/build/waveshare_s3_lcd_2_1/partitions.bin
            .pio/build/waveshare_s3_lcd_1_9/firmware.bin
            .pio/build/waveshare_s3_lcd_1_9/bootloader.bin
            .pio/build/waveshare_s3_lcd_1_9/partitions.bin
